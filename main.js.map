module.exports = "<p>\r\n  <strong>cue card list</strong>\r\n</p>\r\n\r\n<ul>\r\n  <li *ngFor=\"let cueCard of (ccLoaderService.cueCards$ | async);\">\r\n    <strong *ngIf=\"ccLoaderService.cueCardActive === cueCard\" class=\"selected-marker\">Selected</strong>\r\n    <app-cue-card [cueCard]=\"cueCard\"></app-cue-card>\r\n  </li>\r\n</ul>\r\n\r\nTest: <pre>{{ccLoaderService.cueCards$ | async | json}}</pre>\r\n"
