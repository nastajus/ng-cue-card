<svg xmlns="http://www.w3.org/2000/svg" width="900" height="235" viewBox="0 0 900 235" role="img" aria-labelledby="title desc">
<title id="title">From prototype to a better mental model</title>
<desc id="desc">Prototype quickly, isolate a surprising result, study the rule, then verify the changed implementation.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0 0 L8 4 L0 8 Z" fill="#405e91"/>
</marker>
</defs>
<rect x="1" y="1" width="898" height="233" rx="18" fill="#f8faff" stroke="#a9b9d8"/>
<g font-family="system-ui, Segoe UI, sans-serif">
<text x="450" y="44" font-size="29" fill="#142951" font-weight="750" text-anchor="middle">From prototype to a better mental model</text>
<rect x="28" y="80" width="190" height="76" rx="13" fill="#e5edff" stroke="#9caed1"/>
<text x="123" y="114" font-size="21" fill="#162a52" font-weight="700" text-anchor="middle">Prototype</text>
<text x="123" y="141" font-size="17" fill="#253657" font-weight="500" text-anchor="middle">Get it on screen</text>
<path d="M220 118 L241 118" fill="none" stroke="#405e91" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="246" y="80" width="190" height="76" rx="13" fill="#e7f5ef" stroke="#9caed1"/>
<text x="341" y="114" font-size="21" fill="#162a52" font-weight="700" text-anchor="middle">Isolate</text>
<text x="341" y="141" font-size="17" fill="#253657" font-weight="500" text-anchor="middle">Reproduce one case</text>
<path d="M438 118 L459 118" fill="none" stroke="#405e91" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="464" y="80" width="190" height="76" rx="13" fill="#e5edff" stroke="#9caed1"/>
<text x="559" y="114" font-size="21" fill="#162a52" font-weight="700" text-anchor="middle">Understand</text>
<text x="559" y="141" font-size="17" fill="#253657" font-weight="500" text-anchor="middle">Find the rule</text>
<path d="M656 118 L677 118" fill="none" stroke="#405e91" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="682" y="80" width="190" height="76" rx="13" fill="#e7f5ef" stroke="#9caed1"/>
<text x="777" y="114" font-size="21" fill="#162a52" font-weight="700" text-anchor="middle">Verify</text>
<text x="777" y="141" font-size="17" fill="#253657" font-weight="500" text-anchor="middle">Try both cases</text>
<text x="450" y="197" font-size="20" fill="#253657" font-weight="500" text-anchor="middle">Example: explain why one pair of quiz cards overlapped and another did not.</text>
</g>
</svg>
