<svg xmlns="http://www.w3.org/2000/svg" width="900" height="263" viewBox="0 0 900 263" role="img" aria-labelledby="title desc">
<title id="title">Conceptual Leitner progression</title>
<desc id="desc">Successful recalls advance levels with longer intervals. In the project inspiration, forgetting sends the card to level one.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0 0 L8 4 L0 8 Z" fill="#405e91"/>
</marker>
</defs>
<rect x="1" y="1" width="898" height="261" rx="18" fill="#f8faff" stroke="#a9b9d8"/>
<g font-family="system-ui, Segoe UI, sans-serif">
<text x="450" y="44" font-size="29" fill="#142951" font-weight="750" text-anchor="middle">Conceptual Leitner progression</text>
<rect x="28" y="76" width="262.6666666666667" height="76" rx="13" fill="#e5edff" stroke="#9caed1"/>
<text x="159.33333333333334" y="110" font-size="21" fill="#162a52" font-weight="700" text-anchor="middle">Level 1</text>
<text x="159.33333333333334" y="137" font-size="17" fill="#253657" font-weight="500" text-anchor="middle">Review sooner</text>
<path d="M292.6666666666667 114 L313.6666666666667 114" fill="none" stroke="#405e91" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="318.6666666666667" y="76" width="262.6666666666667" height="76" rx="13" fill="#e7f5ef" stroke="#9caed1"/>
<text x="450" y="110" font-size="21" fill="#162a52" font-weight="700" text-anchor="middle">Level 2</text>
<text x="450" y="137" font-size="17" fill="#253657" font-weight="500" text-anchor="middle">Longer interval</text>
<path d="M583.3333333333334 114 L604.3333333333334 114" fill="none" stroke="#405e91" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="609.3333333333334" y="76" width="262.6666666666667" height="76" rx="13" fill="#e5edff" stroke="#9caed1"/>
<text x="740.6666666666667" y="110" font-size="21" fill="#162a52" font-weight="700" text-anchor="middle">Level 3</text>
<text x="740.6666666666667" y="137" font-size="17" fill="#253657" font-weight="500" text-anchor="middle">Longer again</text>
<path d="M742 162 V198 H159 V163" fill="none" stroke="#405e91" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="450" y="235" font-size="20" fill="#253657" font-weight="500" text-anchor="middle">Forgotten card returns to level 1 in the original inspiration.</text>
</g>
</svg>
